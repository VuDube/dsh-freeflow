name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check all sources
        run: |
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit and integration tests
        run: npm test
      - name: Validate config and manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('src/config/default.json','utf8')); console.log('json ok')"
