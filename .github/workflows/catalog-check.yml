name: Catalog check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-check
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live-verify all keyless providers and models
        env:
          CATALOG_PROBE_CHAT: 'true'
        run: node scripts/catalog-check.mjs
      - name: Commit refreshed catalog
        run: |
          git config user.name "VuDube"
          git config user.email "VuDube@users.noreply.github.com"
          git add docs/MODELS.md docs/MODELS.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "chore(catalog): hourly live verification of keyless providers and models"
            git push
          fi
