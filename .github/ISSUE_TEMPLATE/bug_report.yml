name: Bug report
description: Report a problem with dsh-freeflow
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill this bug report. Please never paste API keys or token file contents.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `dsh web`
        2. Select model `anonymous/...`
        3. See error
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: 0.2.2-rc.1
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: 22.23.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Which provider?
      options:
        - anonymous (OpenCode Zen)
        - freellmpool
        - gemini-oauth
        - gateway/other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Redact any Authorization headers or token file content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: No secrets are included in this issue
          required: true
